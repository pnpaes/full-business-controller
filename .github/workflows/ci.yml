name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Day-one smoke: migrate (no-op re-run) → bootstrap → SQL assertions.
      - run: npm run ci:day-one
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Rehearse the whole migration chain up → down → up on its own scratch DB.
      - run: npx vitest run packages/persistence/src/migrations.chain.postgres.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Offline Terraform gates only: `fmt` and `validate` need neither the Spaces
  # remote-state backend nor DO credentials, so they run on every push/PR.
  # `terraform plan` is deliberately NOT in CI because the Spaces/S3 backend and
  # a real DIGITALOCEAN_TOKEN are required; plan is a credentialed pre-apply step
  # (see docs/runbooks/deployment.md), while fmt/validate are the offline gates.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Terraform version
        id: tf_version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          # Single source of truth: .terraform-version (1.16.3).
          terraform_version: ${{ steps.tf_version.outputs.version }}
      - name: terraform fmt -check -recursive
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: terraform init -backend=false && terraform validate (staging)
        working-directory: infra/envs/staging
        run: |
          terraform init -backend=false
          terraform validate
      - name: terraform init -backend=false && terraform validate (production)
        working-directory: infra/envs/production
        run: |
          terraform init -backend=false
          terraform validate

  # End-to-end smoke (M1c) of the *running* system: boots the built `next start`
  # server and drives a real browser (login → read /jobs → one competitor-source
  # mutation → assert in the UI). Separate from `verify` so the fast job stays
  # fast. No cloud credentials: postgres is the service, the owner comes from
  # `npm run bootstrap`, and nothing external is called (both worker/scheduler
  # kill switches are off). Playwright is installed here, not in package.json, so
  # `verify` never downloads a browser.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      BOOTSTRAP_ORGANIZATION_NAME: Aquarela E2E
      BOOTSTRAP_OWNER_EMAIL: owner@example.com
      BOOTSTRAP_OWNER_USERNAME: owner
      BOOTSTRAP_OWNER_PASSWORD: CiE2eSmokePassw0rd
      E2E_OWNER_PASSWORD: CiE2eSmokePassw0rd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run bootstrap
      - name: Install Playwright (library + chromium, ad hoc)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run the end-to-end smoke
        run: node scripts/e2e-smoke.mjs
      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshot
          path: storage/tmp/e2e-failure.png
          if-no-files-found: ignore
