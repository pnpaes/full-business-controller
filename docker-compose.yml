services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquarela
      POSTGRES_PASSWORD: aquarela
      POSTGRES_DB: aquarela
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarela -d aquarela"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
