# Proposed controlled values; Phase 0 must approve labels, meanings and localization.
# Per-entity workflow states (receipt/production/transfer/count/import) take precedence over the
# generic document_status, which is retained only for entities without a dedicated state machine.

document_status: [draft, submitted, approved, rejected, retired]
receipt_status: [draft, submitted, accepted, rejected, reversed]
production_status: [planned, released, in_progress, completed, cancelled]
transfer_status: [draft, requested, approved, dispatched, received, cancelled]
count_status: [draft, counting, submitted, approved, cancelled]
import_status: [uploaded, parsed, needs_review, validated, posted, partially_posted, failed, superseded]
reconciliation_status: [pending, within_tolerance, exception, resolved, approved]
task_status: [open, in_progress, blocked, resolved, dismissed]
cost_behavior: [fixed, variable, mixed]
item_type: [ingredient, packaging, cleaning_supply, consumable, intermediate, finished_good, non_stock_supply]
inventory_policy: [stocked, non_stock, made_to_order]
location_kind: [operating, central_production, virtual_transit]
storage_area_kind: [kitchen, dry_store, refrigerator, freezer, front_counter, transit, other]
channel_code: [dine_in, takeaway, wolt, direct_online, other]
recipe_component_kind: [ingredient, packaging, sub_recipe]
product_kind: [base, variant, add_on]
cost_card_state: [draft, approved, superseded]
stock_movement_type:
  - receipt
  - receipt_reversal
  - production_consumption
  - production_output
  - sale_consumption
  - transfer_dispatch
  - transfer_receipt
  - waste
  - count_adjustment
  - correction
  - revaluation
movement_source_type: [goods_receipt, production_batch, transfer, stock_count, sales_line, waste_event, adjustment, revaluation, correction]
waste_stage:
  - receiving
  - storage_expiry
  - preparation
  - production
  - display
  - unsold_finished_goods
  - customer_return
  - count_discovered
  - other
approval_decision: [approved, rejected]
forecast_grain: [day_location, day_location_category, day_location_product]

